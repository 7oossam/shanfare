<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c22"><meta name="description" content="مورد الظلال — مواجهة تكتيكية عربية بالبطاقات."><title>الشنفرى • مورد الظلال</title><link rel="preload" as="image" href="assets/oasis.webp"><link rel="preload" as="image" href="assets/characters.png"><link rel="stylesheet" href="style.css?v=4"></head><body><svg class="svg-defs" aria-hidden="true"><defs>
<symbol id="bow" viewBox="0 0 60 60"><path d="M16 8Q59 30 16 52L26 30Z M8 30H49 M42 24L49 30 42 36"/></symbol>
<symbol id="knife" viewBox="0 0 60 60"><path d="M40 7Q47 27 24 40L18 34Z M15 32L28 45 M20 40L11 51 7 47 17 37"/></symbol>
<symbol id="shield" viewBox="0 0 60 60"><path d="M30 6L49 14 46 35Q42 46 30 54Q18 46 14 35L11 14Z M30 16V42 M20 27H40"/></symbol>
<symbol id="run" viewBox="0 0 60 60"><circle cx="37" cy="11" r="5"/><path d="M33 20L23 32 36 38 43 53 M29 26L40 28 49 20 M25 33L16 48 6 48 M12 19H25 M5 27H17"/></symbol>
<symbol id="wolf" viewBox="0 0 60 60"><path d="M11 5L26 16 34 16 49 5 46 33 30 53 14 33Z M17 25L25 29 M43 25L35 29 M25 37H35L30 42Z"/></symbol>
<symbol id="eye" viewBox="0 0 60 60"><path d="M5 30Q30 5 55 30Q30 55 5 30Z M10 50L50 10"/><circle cx="30" cy="30" r="8"/></symbol>
<symbol id="wind" viewBox="0 0 60 60"><path d="M5 20H39Q55 20 48 8Q42 2 36 9 M5 30H48Q60 30 53 43Q46 50 39 42 M6 40H24Q37 40 30 52"/></symbol>
<symbol id="sun" viewBox="0 0 60 60"><circle cx="30" cy="30" r="12"/><path d="M30 3V10 M30 50V57 M3 30H10 M50 30H57 M10 10L16 16 M44 44L50 50 M10 50L16 44 M44 16L50 10"/></symbol>
</defs></svg>
<div class="app"><header class="game-header"><div class="game-title"><span>الشَّنْفَرَى</span><h1>مَوْرِد الظِّلال</h1></div><div class="turn-tag">الدور <b id="turn">١</b><span id="phase-label">دورك</span></div><nav class="top-actions"><button id="help" class="icon-btn" aria-label="كيف ألعب؟">؟</button><button id="menu-btn" class="icon-btn" aria-label="قائمة المواجهة" aria-expanded="false">⋯</button></nav><div id="game-menu" class="game-menu hidden"><button id="trial-start">تجربة الاستدراج ✦</button><button id="trial-report">قارن افتتاحيتك</button><button id="return-classic">عد إلى محاولتك السابقة</button><button id="route-info">درب الرحلة</button><button id="journal">سجلّ المواجهة</button><button id="sound">تشغيل الصوت</button><button id="restart">محاولة جديدة</button></div></header>
<main class="battle-layout">
<section class="combat-bar" aria-label="حالة الشنفرى"><div class="player-stats"><div class="stat-name"><strong>الشنفرى</strong><bdi id="health-numbers" dir="ltr"></bdi></div><div class="health-track"><i id="health-fill"></i></div></div><div class="stat-pill block-pill"><b id="block">٠</b><small>اتّقاء</small></div><div class="stat-pill energy-pill"><b id="energy">٣</b><small>طاقة</small></div><div class="stat-pill strain-pill"><b id="strain">٠</b><small>إجهاد</small></div></section>
<section id="enemy-panels" class="enemy-panels" aria-label="الخصوم ونيّاتهم"></section>
<section class="arena" aria-label="ساحة القتال"><div class="arena-vignette"></div><span class="arena-title">وادي السَّرَاة · قبيل الفجر</span><div id="actors"></div><svg id="enemy-paths" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true"></svg><svg id="move-path" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true"></svg><div id="combat-fx" aria-hidden="true"></div><div id="positions" class="positions" aria-label="مواضع الوادي"></div></section>
<section class="tactics-strip" aria-label="توقّع الضرر"><button id="terrain-status" class="terrain-btn" aria-label="معلومة الموضع"></button><strong id="forecast" aria-live="polite"></strong><span id="wolf-status"></span></section>
<section class="instincts" aria-label="المهارات الدائمة"><button id="leap" class="instinct"><span>↝</span><div><strong>وثبة</strong><small>بطاقة · +١ إجهاد</small></div></button><button id="drink" class="instinct"><span>◒</span><div><strong>ماء <b id="water-count"></b></strong><small>١ طاقة · تعافٍ</small></div></button><button id="exert" class="instinct"><span>✦</span><div><strong>تَجَلَّد</strong><small>+٢ طاقة · +٢ إجهاد</small></div></button></section>
<section class="action-preview" aria-label="معاينة خطوتك" aria-live="polite"><div class="preview-copy"><strong id="preview-title">اختر بطاقة</strong><p id="preview-text">ثم اختر خصمًا للهجوم، أو اضغط «العب» للمهارات.</p></div><div class="preview-controls"><button id="confirm-action" class="confirm-action hidden">العب</button><button id="cancel-action" class="cancel-action hidden" aria-label="إلغاء الاختيار">إلغاء</button></div></section>
<section class="hand-area"><div class="hand-top"><span id="selection-hint">بطاقاتك</span><span class="hand-scroll-hint">اسحب لرؤية البقية ↔</span><button id="deck-info" class="text-btn">الرزمة <span id="deck-count"></span> ◇</button></div><div id="hand" class="hand" aria-label="بطاقات اليد"></div></section>
<section class="bottom-bar"><div id="last-action" class="last-action" aria-live="polite">خطّط قبل أن تضرب</div><button id="end-turn" class="end-turn">إنهاء الدور <span>←</span></button></section>
</main></div><div id="toast" role="status"></div><div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div><script type="module" src="app.js?v=4"></script></body></html>
